name: Build Musl Static Binary (CentOS7.9)
# 并发控制：同分支取消旧构建，避免缓存冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 触发规则：push main/develop、PR、手动触发
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 全局构建超时限制
jobs:
  build-musl-centos7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # 官方纯净 CentOS7.9 镜像，匹配运行环境
      image: centos:7.9.2009
      options: --privileged
    steps:
    - name: 1. 修复CentOS7 全部yum源(Base/EPEL/SCL)，解决sclo-rh失效
      run: |
        set -euo pipefail
        # 备份原有全部失效repo
        mkdir -p /etc/yum.repos.d/repo.bak
        mv /etc/yum.repos.d/*.repo /etc/yum.repos.d/repo.bak/ || true
        
        # 通用下载函数：阿里失败自动切网易，增加超时重试
        download() {
          local dst="$1"
          local url1="$2"
          local url2="$3"
          echo "下载 $dst ..."
          if curl --connect-timeout 10 --retry 3 --retry-delay 2 -fsSL -o "$dst" "$url1"; then
            echo ">> 使用阿里云镜像"
          else
            echo ">> 阿里超时，切换网易镜像"
            curl --connect-timeout 10 --retry 3 --retry-delay 2 -fsSL -o "$dst" "$url2"
          fi
        }
        
        # 1. 替换 CentOS Base 基础源（可用）
        download \
          /etc/yum.repos.d/CentOS-Base.repo \
          https://mirrors.aliyun.com/repo/Centos-7.repo \
          https://mirrors.163.com/.help/CentOS7-Base-163.repo
          
        # 2. 替换 EPEL 源（可用）
        download \
          /etc/yum.repos.d/epel.repo \
          https://mirrors.aliyun.com/repo/epel-7.repo \
          https://mirrors.163.com/epel/epel.repo
    
        # ========== 本地静态生成SCL源，彻底规避404 ==========
        echo "本地写入CentOS SCL软件源配置"
        cat > /etc/yum.repos.d/CentOS-SCLo-scl-rh.repo <<EOT
        [centos-sclo-sclo]
        name=CentOS-7 - SCLo sclo
        baseurl=https://mirrors.aliyun.com/centos/7/sclo/\$basearch/sclo/
        gpgcheck=1
        enabled=1
        gpgkey=https://mirrors.aliyun.com/centos/RPM-GPG-KEY-CentOS-7,https://mirrors.aliyun.com/centos/RPM-GPG-KEY-CentOS-SCLo-scl
        
        [centos-sclo-rh]
        name=CentOS-7 - SCLo rh
        baseurl=https://mirrors.aliyun.com/centos/7/sclo/\$basearch/rh/
        gpgcheck=1
        enabled=1
        gpgkey=https://mirrors.aliyun.com/centos/RPM-GPG-KEY-CentOS-7,https://mirrors.aliyun.com/centos/RPM-GPG-KEY-CentOS-SCLo-rh
        EOT


              
        # 清理缓存并重建
        yum clean all
        yum makecache fast -e 0
        
        # 一次性批量安装全部依赖
        yum install -y wget curl unzip xz make cmake3 autoconf automake libtool patch git golang
        yum install -y devtoolset-9-gcc devtoolset-9-gcc-c++ devtoolset-9-make
        yum install -y glibc-static libstdc++-static zlib-static openssl-static


    - name: 2. 拉取源码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 浅克隆加速CI

    - name: 3. 缓存musl工具链（绑定musl版本+系统依赖文件哈希）
      id: cache-musl
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/musl-toolchain
        key: musl-v1.2.5-centos7-${{ hashFiles('/etc/yum.repos.d/*.repo') }}

    - name: 4. 编译musl-libc静态工具链（无缓存时执行）
      if: steps.cache-musl.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        source /opt/rh/devtoolset-9/enable
        MUSL_VER=1.2.5
        WORK_ROOT=${{ github.workspace }}
        MUSL_PREFIX=$WORK_ROOT/musl-toolchain
        mkdir -p $WORK_ROOT/musl-src
        cd $WORK_ROOT/musl-src
        # 替换国内镜像下载musl源码，规避境外源超时
        wget --timeout=10 --tries=3 -q https://mirrors.tuna.tsinghua.edu.cn/musl/releases/musl-$MUSL_VER.tar.gz
        tar -xf musl-$MUSL_VER.tar.gz
        cd musl-$MUSL_VER
        ./configure --prefix=$MUSL_PREFIX
        make -j$(nproc)
        make install

    - name: 5. 全局注入musl+高版本GCC编译环境变量
      run: |
        echo "PATH=${{ github.workspace }}/musl-toolchain/bin:$PATH" >> $GITHUB_ENV
        echo "CC=musl-gcc" >> $GITHUB_ENV
        echo "CXX=musl-g++" >> $GITHUB_ENV
        echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
        # 全局强制加载devtoolset9高版本GCC，所有子进程生效
        echo "source /opt/rh/devtoolset-9/enable" >> $GITHUB_ENV
        echo "BASH_ENV=/opt/rh/devtoolset-9/enable" >> $GITHUB_ENV

    - name: 6. 编译CodeWhale musl静态程序（自动区分C++/Rust/Go）
      run: |
        set -euo pipefail
        source /opt/rh/devtoolset-9/enable
        WORK_ROOT=${{ github.workspace }}
        OUTPUT_DIR=$WORK_ROOT/dist
        mkdir -p $OUTPUT_DIR
        rm -rf build-musl && mkdir build-musl
        cd build-musl

        # CMake C++项目（仓库主流场景）
        if [ -f "$WORK_ROOT/CMakeLists.txt" ]; then
          cmake3 .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_CXX_COMPILER=musl-g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -s" \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG"
          make -j$(nproc)
          # 仅复制项目主程序，过滤测试二进制（按需修改匹配名称）
          find . -name "codewhale" -type f -executable -exec cp {} $OUTPUT_DIR \;
        # Rust 项目
        elif [ -f "$WORK_ROOT/Cargo.toml" ]; then
          # Rust安装增加超时重试
          curl --connect-timeout 10 --retry 3 -fsSL https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add x86_64-unknown-linux-musl
          cd $WORK_ROOT
          cargo build --release --target=x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/codewhale $OUTPUT_DIR/
        # Golang 项目（零CGO天然无依赖）
        elif [ -f "$WORK_ROOT/go.mod" ]; then
          cd $WORK_ROOT
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o $OUTPUT_DIR/codewhale
        else
          echo "ERROR: 未识别构建文件(CMakeLists/Cargo/go.mod)"
          exit 1
        fi

    - name: 7. 产物校验：强制无动态依赖
      run: |
        set -euo pipefail
        OUTPUT_DIR=${{ github.workspace }}/dist
        for bin in $OUTPUT_DIR/*; do
          if [ ! -x "$bin" ]; then continue; fi
          echo "校验二进制: $bin"
          # 更严谨校验：存在动态链接库则失败
          if ldd "$bin" 2>&1 | grep -E "libc.so|libstdc|ld-linux"; then
            echo "FAIL: $bin 存在动态库依赖，构建不合格"
            ldd "$bin"
            exit 1
          fi
          # strip 进一步瘦身
          strip "$bin"
        done
        # 打包压缩制品，减少artifact体积
        tar -czf $WORK_ROOT/codewhale-musl-linux-x86_64.tar.gz -C $OUTPUT_DIR .

    - name: 8. 上传构建制品（CI下载）
      uses: actions/upload-artifact@v4
      with:
        name: codewhale-musl-centos7-static
        path: ${{ github.workspace }}/codewhale-musl-linux-x86_64.tar.gz
        retention-days: 30

    - name: 9. Tag推送时自动发布Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ github.workspace }}/codewhale-musl-linux-x86_64.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
