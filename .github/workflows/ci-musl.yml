name: Release Build
on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-musl-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装Rust + musl编译目标
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true

      # 静态编译，内置所有依赖，关闭动态链接
      - name: Build musl static binary
        env:
          # 强制静态编译所有第三方库
          OPENSSL_STATIC: 1
          OPENSSL_VENDOR: 1
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --features vendored-openssl
          # 重命名产物
          mv target/x86_64-unknown-linux-musl/release/codewhale codewhale-linux-musl-x86_64

      # 上传制品
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          path: codewhale-linux-musl-x86_64

  # 发布时上传到Release Assets
  release:
    needs: build-linux-musl-x64
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            codewhale-linux-musl-x86_64
